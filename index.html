<script type="text/babel">
const { useState, useEffect, useReducer, useRef } = React;

// ─── EXERCISE DATA ─────────────────────────────────────────────────────────

const DAY1_EXERCISES = [

const DAY1_BURNOUTS = [

const DAY2_BURNOUTS = [
  { name: "Floor Press [AMRAP]",         duration: 40, tip: "Continuous reps to failure. Press strictly throughout.", imgFile: "_Assets/ex_floor_press.png" },

  { name: "Skull Crusher [AMRAP]",       duration: 40, tip: "Continuous reps to failure. Elbows fixed and pointing up — triceps only.", imgFile: "_Assets/ex_skull_crusher.png" },

const QUOTES = [
  { text: "The secret of getting ahead is getting started.", author: "Mark Twain" },
  { text: "Success is the sum of small efforts, repeated day in and day out.", author: "Robert Collier" },
  { text: "Take care of your body. It's the only place you have to live.", author: "Jim Rohn" },

  { text: "A year from now you may wish you had started today.", author: "Karen Lamb" },
  { text: "The only bad workout is the one that didn't happen.", author: "Unknown" },
  { text: "Strength does not come from physical capacity. It comes from indomitable will.", author: "Mahatma Gandhi" },
];

// ─── TIMELINE BUILDER ──────────────────────────────────────────────────────

function buildTimeline(day, exhaustionEnabled) {
  const exercises = day === 1 ? DAY1_EXERCISES : DAY2_EXERCISES;
  const burnouts  = day === 1 ? DAY1_BURNOUTS  : DAY2_BURNOUTS;
  const steps = [];
  let id = 0;

  steps.push({ id: id++, type: 'warmup', name: 'Warmup & Mobilize', duration: 300, round: 0,
    imgFile: '_Assets/Warmup.png', tip: 'Dynamic stretches, hip circles, shoulder rolls. Zero knee impacts. Lubricate the joints.' });

  for (let r = 1; r <= 2; r++) {
    exercises.forEach((ex, i) => {
      steps.push({ id: id++, type: 'work', name: ex.name, duration: ex.duration, round: r, imgFile: ex.imgFile, tip: ex.tip });
      const isLastEx = i === exercises.length - 1;
      const nextText = isLastEx
        ? (r === 2 ? (exhaustionEnabled ? `Burnout: ${burnouts[0].name}` : 'Cooldown stretches') : `Round 2: ${exercises[0].name}`)
        : exercises[i + 1].name;
      steps.push({ id: id++, type: 'rest', name: 'Transition Rest', duration: 20, round: r,
        imgFile: '_Assets/Transition.png', tip: 'Slow belly breaths. Shake out the arms. Preview the next movement.', nextUp: nextText });
    });
  }

  if (exhaustionEnabled) {
    burnouts.forEach((ex, i) => {
      steps.push({ id: id++, type: 'work', name: ex.name, duration: ex.duration, round: 'AMRAP', imgFile: ex.imgFile, tip: ex.tip });
      const nextText = i === burnouts.length - 1 ? 'Cooldown stretches' : `Burnout: ${burnouts[i + 1].name}`;
      steps.push({ id: id++, type: 'rest', name: 'Transition Rest', duration: 20, round: 'AMRAP',
        imgFile: '_Assets/Transition.png', tip: 'Breathe. Prepare for next failure threshold.', nextUp: nextText });
    });
  }

  const cooldownDuration = exhaustionEnabled ? 240 : 420;
  steps.push({ id: id++, type: 'cooldown', name: 'Cooldown & Recovery', duration: cooldownDuration, round: 0,
    imgFile: '_Assets/cooldown.png', tip: 'Slow passive stretching. Hamstrings, glutes, chest, lats. Let tissues lengthen.' });

  return steps;
}

function totalDuration(tl) { return tl.reduce((a, s) => a + s.duration, 0); }
function timeFromIdx(tl, idx, tr) {
  let t = tr;
  for (let i = idx + 1; i < tl.length; i++) t += tl[i].duration;
  return t;
}

// ─── AUDIO ─────────────────────────────────────────────────────────────────

let _audioCtx = null;
function getCtx() {
  if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return _audioCtx;
}
function beep(freq = 440, dur = 0.15, vol = 0.06) {
  try {
    const ctx = getCtx();
    if (ctx.state === 'suspended') ctx.resume();
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.connect(g); g.connect(ctx.destination);
    osc.frequency.value = freq;
    g.gain.setValueAtTime(vol, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
    osc.start(); osc.stop(ctx.currentTime + dur);
  } catch(e) {}
}
const sfx = {
  nav:        () => beep(700, 0.12),
  transition: () => { beep(880, 0.2); setTimeout(() => beep(1100, 0.25), 150); },
  countdown:  () => beep(520, 0.1),
  cooldown:   () => beep(330, 0.12),
  success:    () => { beep(523,0.15); setTimeout(()=>beep(659,0.15),120); setTimeout(()=>beep(784,0.35),240); setTimeout(()=>beep(1046,0.55),360); },
};

// ─── STATE ─────────────────────────────────────────────────────────────────

function makeInitial() {
  const tl = buildTimeline(1, false);
  return {
    phase: 'intro',
    day: 1,
    exhaustionEnabled: false,
    isMuted: false,
    isPlaying: false,
    currentIdx: 0,
    timeRemaining: tl[0].duration,
    totalSecsLeft: totalDuration(tl),
    timeline: tl,
    viewFilter: 'all',
    roadmapOpen: false,
    pacerTick: 0,
    quote: QUOTES[0],
  };
}

function reducer(s, a) {
  switch (a.type) {
    case 'START': {
      const tl = buildTimeline(a.day, s.exhaustionEnabled);
      return { ...s, phase: 'workout', day: a.day, isPlaying: true, currentIdx: 0,
               timeRemaining: tl[0].duration, totalSecsLeft: totalDuration(tl), timeline: tl, pacerTick: 0 };
    }
    case 'TOGGLE_PLAY': return { ...s, isPlaying: !s.isPlaying };
    case 'TICK': {
      const nr = s.timeRemaining - 1;
      const nt = Math.max(0, s.totalSecsLeft - 1);
      if (nr <= 0) {
        const ni = s.currentIdx + 1;
        if (ni >= s.timeline.length)
          return { ...s, isPlaying: false, phase: 'celebration', timeRemaining: 0, totalSecsLeft: 0,
                   quote: QUOTES[Math.floor(Math.random() * QUOTES.length)] };
        return { ...s, currentIdx: ni, timeRemaining: s.timeline[ni].duration, totalSecsLeft: nt, pacerTick: 0 };
      }
      return { ...s, timeRemaining: nr, totalSecsLeft: nt };
    }
    case 'PACER_TICK': return { ...s, pacerTick: s.pacerTick + 100 };
    case 'JUMP': {
      const tr = s.timeline[a.idx].duration;
      return { ...s, currentIdx: a.idx, timeRemaining: tr, totalSecsLeft: timeFromIdx(s.timeline, a.idx, tr), pacerTick: 0, roadmapOpen: false };
    }
    case 'PREV': {
      const idx = Math.max(0, s.currentIdx - 1);
      const tr = s.timeline[idx].duration;
      return { ...s, currentIdx: idx, timeRemaining: tr, totalSecsLeft: timeFromIdx(s.timeline, idx, tr), pacerTick: 0 };
    }
    case 'NEXT': {
      const idx = Math.min(s.timeline.length - 1, s.currentIdx + 1);
      const tr = s.timeline[idx].duration;
      return { ...s, currentIdx: idx, timeRemaining: tr, totalSecsLeft: timeFromIdx(s.timeline, idx, tr), pacerTick: 0 };
    }
    case 'SET_DAY': {
      const tl = buildTimeline(a.day, s.exhaustionEnabled);
      return { ...s, day: a.day, isPlaying: false, currentIdx: 0,
               timeRemaining: tl[0].duration, totalSecsLeft: totalDuration(tl), timeline: tl, pacerTick: 0 };
    }
    case 'TOGGLE_EXHAUSTION': {
      const ex = !s.exhaustionEnabled;
      const tl = buildTimeline(s.day, ex);
      const idx = Math.min(s.currentIdx, tl.length - 1);
      const tr = tl[idx].duration;
      return { ...s, exhaustionEnabled: ex, timeline: tl, currentIdx: idx, timeRemaining: tr, totalSecsLeft: timeFromIdx(tl, idx, tr) };
    }
    case 'TOGGLE_MUTE': return { ...s, isMuted: !s.isMuted };
    case 'SET_FILTER': return { ...s, viewFilter: a.filter };
    case 'TOGGLE_ROADMAP': return { ...s, roadmapOpen: !s.roadmapOpen };
    case 'CLOSE_ROADMAP': return { ...s, roadmapOpen: false };
    case 'RESET': return { ...makeInitial(), phase: 'intro' };
    default: return s;
  }
}

function useWorkout() {
  const [state, dispatch] = useReducer(reducer, null, makeInitial);
  const prevIdx   = useRef(state.currentIdx);
  const prevPhase = useRef(state.phase);

  useEffect(() => {
    if (!state.isPlaying || state.phase !== 'workout') return;
    const id = setInterval(() => dispatch({ type: 'TICK' }), 1000);
    return () => clearInterval(id);
  }, [state.isPlaying, state.phase]);

  useEffect(() => {
    if (!state.isPlaying || state.phase !== 'workout') return;
    const id = setInterval(() => dispatch({ type: 'PACER_TICK' }), 100);
    return () => clearInterval(id);
  }, [state.isPlaying, state.phase]);

  useEffect(() => {
    if (state.currentIdx !== prevIdx.current && !state.isMuted) sfx.transition();
    prevIdx.current = state.currentIdx;
  }, [state.currentIdx]);

  useEffect(() => {
    if (state.phase === 'celebration' && prevPhase.current !== 'celebration' && !state.isMuted) sfx.success();
    prevPhase.current = state.phase;
  }, [state.phase]);

  useEffect(() => {
    if (!state.isPlaying || state.isMuted) return;
    const step = state.timeline[state.currentIdx];
    if (step && step.type === 'cooldown' && state.timeRemaining > 0 && state.timeRemaining % 10 === 0) sfx.cooldown();
    else if (state.timeRemaining <= 3 && state.timeRemaining > 0) sfx.countdown();
  }, [state.timeRemaining]);

  return { state, dispatch };
}

// ─── HELPERS ───────────────────────────────────────────────────────────────

function fmt(s) {
  const m  = Math.floor(Math.max(0, s) / 60).toString().padStart(2, '0');
  const ss = (Math.max(0, s) % 60).toString().padStart(2, '0');
  return `${m}:${ss}`;
}

// ─── TIMER RING ─────────────────────────────────────────────────────────────

const R = 90;
const C = 2 * Math.PI * R;

function TimerRing({ timeRemaining, duration, stepType, isAMRAP }) {
  const pct    = duration > 0 ? timeRemaining / duration : 0;
  const offset = C - pct * C;
  const color  = isAMRAP ? '#d97706'
               : stepType === 'work'     ? '#f4f4f0'
               : stepType === 'rest'     ? '#d97706'
               : '#52525b';

  return (
    <svg viewBox="0 0 220 220" style={{ width: '100%', height: '100%' }}>
      <circle cx="110" cy="110" r="108" fill="none" stroke="#18181b" strokeWidth="0.75" />
      <line x1="110" y1="2"   x2="110" y2="13"  stroke="#3f3f46" strokeWidth="1.5" />
      <line x1="110" y1="207" x2="110" y2="218" stroke="#3f3f46" strokeWidth="1.5" />
      <line x1="2"   y1="110" x2="13"  y2="110" stroke="#3f3f46" strokeWidth="1.5" />
      <line x1="207" y1="110" x2="218" y2="110" stroke="#3f3f46" strokeWidth="1.5" />
      <circle cx="110" cy="110" r={R} fill="none" stroke="#27272a" strokeWidth="2.5" />
      <circle cx="110" cy="110" r={R} fill="none" stroke={color} strokeWidth="2.5"
        strokeDasharray={C} strokeDashoffset={offset} strokeLinecap="square"
        style={{ transform: 'rotate(-90deg)', transformOrigin: '110px 110px', transition: 'stroke-dashoffset 0.3s linear, stroke 0.3s ease' }} />
      <line x1="106" y1="110" x2="114" y2="110" stroke="#3f3f46" strokeWidth="0.5" />
      <line x1="110" y1="106" x2="110" y2="114" stroke="#3f3f46" strokeWidth="0.5" />
    </svg>
  );
}

// ─── TEMPO PACER ───────────────────────────────────────────────────────────

function TempoPacer({ pacerTick, visible }) {
  if (!visible) return null;
  const phase = pacerTick % 4000;
  const isEcc = phase < 3000;
  const pct   = isEcc ? (3000 - phase) / 3000 : (phase - 3000) / 1000;

  return (
    <div style={{ padding: '5px 16px', borderTop: '1px solid #18181b' }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 3 }}>
        <span style={{ fontFamily: 'Space Mono', fontSize: 11, color: '#96969e', textTransform: 'uppercase', letterSpacing: '0.1em' }}>TEMPO PACER</span>
        <span style={{ fontFamily: 'Space Mono', fontSize: 11, fontWeight: 700, color: isEcc ? '#c7c7cd' : '#d97706' }}>
          {isEcc ? '↓ ECCENTRIC 3S' : '↑ DRIVE 1S'}
        </span>
      </div>
      <div style={{ height: 4, background: '#0a0a0b', border: '1px solid #18181b', overflow: 'hidden' }}>
        <div style={{ height: '100%', width: `${pct * 100}%`, background: isEcc ? '#52525b' : '#d97706', transition: 'width 0.1s linear' }} />
      </div>
    </div>
  );
}

// ─── INTRO SCREEN ──────────────────────────────────────────────────────────

  return (

      <div style={{ width: '100%', maxWidth: 360, maxHeight: '100%', overflowY: 'auto', background: '#0c0c0e', border: '1px solid #27272a', padding: 16, position: 'relative', margin: 'auto' }}>
        <span aria-hidden="true" style={{ position: 'absolute', top: -6, left: -6, color: '#3f3f46', fontSize: 12, userSelect: 'none', fontFamily: 'monospace' }}>+</span>
        <span aria-hidden="true" style={{ position: 'absolute', top: -6, right: -6, color: '#3f3f46', fontSize: 12, userSelect: 'none', fontFamily: 'monospace' }}>+</span>
        <span aria-hidden="true" style={{ position: 'absolute', bottom: -6, left: -6, color: '#3f3f46', fontSize: 12, userSelect: 'none', fontFamily: 'monospace' }}>+</span>
        <span aria-hidden="true" style={{ position: 'absolute', bottom: -6, right: -6, color: '#3f3f46', fontSize: 12, userSelect: 'none', fontFamily: 'monospace' }}>+</span>

        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', paddingBottom: 10, marginBottom: 12, borderBottom: '1px dashed #27272a' }}>
          <span style={{ color: '#d97706', fontFamily: 'Space Mono', fontSize: 14, fontWeight: 700, letterSpacing: '0.2em', textTransform: 'uppercase' }}>SYS.INIT</span>
          <span style={{ color: '#96969e', fontFamily: 'Space Mono', fontSize: 12 }}>COMPANION_15LB</span>
        </div>

        <div style={{ background: 'rgba(0,0,0,0.5)', border: '1px solid #18181b', padding: '10px 14px', marginBottom: 12, fontFamily: 'Space Mono', fontSize: 13, lineHeight: 1.5, color: '#c7c7cd' }}>
          <div style={{ color: '#f4f4f0', fontWeight: 700, marginBottom: 4 }}>BIOMECHANICAL PROTOCOLS:</div>
          <div>&gt; JOINT DEPRESSURIZATION............<span style={{ color: '#c7c7cd' }}> [PASS]</span></div>

              </button>
            ))}

        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '8px 14px', border: '1px dashed #27272a', background: 'rgba(0,0,0,0.3)', marginBottom: 12 }}>

          </div>
          <button onClick={onToggleExhaustion} aria-pressed={exhaustionEnabled} aria-label="Toggle exhaustion overload mode" style={{
            padding: '7px 12px', minHeight: 36, fontFamily: 'Space Mono', fontSize: 12, fontWeight: 700, cursor: 'pointer',
            border: `1px solid ${exhaustionEnabled ? '#d97706' : '#3f3f46'}`,
            color: exhaustionEnabled ? '#d97706' : '#9c9ca4', background: 'transparent', transition: 'all 0.2s',
          }}>
            {exhaustionEnabled ? '[ON]' : '[OFF]'}
          </button>
        </div>

        <button onClick={() => onStart(selectedDay)} style={{
          width: '100%', padding: '13px 0', minHeight: 46, background: '#f4f4f0', color: '#0a0a0a', fontFamily: 'Space Mono',
          fontSize: 14, fontWeight: 700, letterSpacing: '0.2em', textTransform: 'uppercase',
          cursor: 'pointer', border: 'none', transition: 'background 0.15s',
        }}>
          [ EXECUTE SEQUENCE ]
        </button>
      </div>
    </div>
  );
}

      <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#71717a" strokeWidth="1.5" strokeLinecap="square" strokeLinejoin="miter">

        <button onClick={onToggleMute} aria-pressed={isMuted} aria-label={isMuted ? 'Unmute audio cues' : 'Mute audio cues'} style={{ width: 38, height: 38, padding: 0, border: '1px solid #27272a', background: 'transparent', color: '#aeaeb6', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          {isMuted ? (
            <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="1.5" aria-hidden="true">

// ─── DAY TABS ──────────────────────────────────────────────────────────────

function DayTabs({ day, onChange }) {

          {label}

// ─── EXERCISE PANEL ────────────────────────────────────────────────────────

function ExercisePanel({ step, timeline, currentIdx, timeRemaining, pacerTick, isPlaying, onPrev, onNext }) {
  const touchX = useRef(null);

  const onTouchStart = (e) => { touchX.current = e.touches[0].clientX; };
  const onTouchEnd   = (e) => {
    if (touchX.current === null) return;
    const dx = e.changedTouches[0].clientX - touchX.current;
    if (Math.abs(dx) > 48) { dx < 0 ? onNext() : onPrev(); }
    touchX.current = null;
  };

  if (!step) return null;

  const isAMRAP    = step.round === 'AMRAP';
  const phaseColor = isAMRAP ? '#d97706' : step.type === 'work' ? '#f4f4f0' : step.type === 'rest' ? '#d97706' : '#52525b';
  const phaseLabel = isAMRAP ? '[BURNOUT_AMRAP]' : step.type === 'work' ? '[OP.WORK]' : step.type === 'rest' ? '[TRANSIT]' : step.type === 'warmup' ? '[PRE-OP]' : '[COOL-DOWN]';
  const roundLabel = isAMRAP ? 'BURNOUT' : (step.type === 'work' || step.type === 'rest') ? `ROUND ${step.round} / 2` : step.type === 'warmup' ? 'PRE-OP' : 'POST-OP';
  const exDesc     = step.type === 'rest'     ? `UP NEXT: ${step.nextUp || (timeline[currentIdx + 1] && timeline[currentIdx + 1].name) || 'FINISH'}`
                   : step.type === 'work'     ? 'Maintain strict 3-second descent. Squeeze at peak.'
                   : step.type === 'cooldown' ? 'Slow passive stretching. Let the tissues lengthen fully.'
                   : 'Dynamic mobility prep. Lubricate joints. Zero knee impacts.';

  return (
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', minHeight: 0, userSelect: 'none', overflow: 'hidden' }}
      onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}>

      {/* Timer Block — flexible: absorbs whatever vertical space is left. Images removed for now (imgFile data kept on each exercise in case we bring them back). */}
      <div style={{ position: 'relative', display: 'flex', alignItems: 'center', justifyContent: 'center', flex: '1 1 0%', minHeight: 0, padding: '6px 0' }}>
        {/* Timer ring — fills available height, capped so it never gets too wide on short/narrow screens */}
        <div style={{ position: 'relative', height: '100%', width: 'auto', aspectRatio: '1', maxWidth: 'min(60vw, 280px)', maxHeight: '280px', flexShrink: 1, zIndex: 1 }}>
          <TimerRing timeRemaining={timeRemaining} duration={step.duration} stepType={step.type} isAMRAP={isAMRAP} />
          <div style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center' }}>
            <span style={{ fontFamily: 'Space Mono', fontSize: 'clamp(1.9rem, 11vw, 3rem)', fontWeight: 700, color: '#ffffff', letterSpacing: '-0.02em', lineHeight: 1 }}>
              {fmt(timeRemaining)}
            </span>
            <span style={{ fontFamily: 'Space Mono', fontSize: 12, fontWeight: 700, color: phaseColor, marginTop: 8, letterSpacing: '0.12em', textTransform: 'uppercase' }}>
              {phaseLabel}
            </span>
          </div>
        </div>
      </div>

      {/* Round badge */}
      <div style={{ display: 'flex', justifyContent: 'center', alignItems: 'center', gap: 10, marginBottom: 8, flexShrink: 0 }}>
        <span style={{ fontFamily: 'Space Mono', fontSize: 13, fontWeight: 700, letterSpacing: '0.12em', textTransform: 'uppercase', padding: '5px 12px', border: `1px solid ${isAMRAP ? '#92400e' : '#27272a'}`, color: isAMRAP ? '#d97706' : '#c7c7cd', background: '#0a0a0b' }}>
          {roundLabel}
        </span>
        {!isAMRAP && (step.type === 'work' || step.type === 'rest') && (
          <div style={{ display: 'flex', gap: 4 }}>
            {[1, 2].map(r => (
              <div key={r} style={{ width: 7, height: 7, border: '1px solid', borderColor: step.round >= r ? '#52525b' : '#27272a', background: step.round >= r ? '#f4f4f0' : 'transparent' }} />
            ))}
          </div>
        )}
      </div>

      {/* Exercise name + description */}
      <div style={{ padding: '0 16px 6px', flexShrink: 0 }}>
        <h2 aria-live="polite" style={{ fontFamily: 'Barlow Condensed', fontSize: 'clamp(1.4rem, 6.5vw, 1.75rem)', fontWeight: 800, color: '#ffffff', textTransform: 'uppercase', letterSpacing: '0.04em', lineHeight: 1.05, margin: '0 0 3px' }}>
          {step.name}
        </h2>
        <p style={{ fontFamily: 'Barlow Condensed', fontSize: 17, color: '#e2e1dd', margin: 0, lineHeight: 1.25, textTransform: 'uppercase', letterSpacing: '0.03em' }}>
          {exDesc}
        </p>
      </div>

      {/* Tip */}
      <div style={{ margin: '0 16px 6px', padding: '8px 14px', border: '1px solid #18181b', background: '#0a0a0b', display: 'flex', gap: 10, flexShrink: 0 }}>
        <span style={{ fontFamily: 'Space Mono', fontSize: 12, color: '#71717a', flexShrink: 0, paddingTop: 1 }} aria-hidden="true">i</span>
        <p style={{ fontFamily: 'Barlow Condensed', fontSize: 16, color: '#e2e1dd', margin: 0, lineHeight: 1.25 }}>{step.tip}</p>
      </div>

      <TempoPacer pacerTick={pacerTick} visible={isPlaying && step.type === 'work'} />
    </div>
  );
}

// ─── BOTTOM BAR ────────────────────────────────────────────────────────────

function BottomBar({ isPlaying, onPlayPause, onPrev, onNext, onOpenRoadmap, currentIdx, total, timeline, roadmapOpen }) {
  const isFirst = currentIdx === 0;
  const isLast  = currentIdx === total - 1;
  const navBtn  = (disabled) => ({
    padding: '10px 14px', minWidth: 44, minHeight: 44, border: '1px solid #27272a', background: '#0c0c0e',
    color: disabled ? '#3f3f46' : '#aeaeb6', cursor: disabled ? 'not-allowed' : 'pointer',
    display: 'flex', alignItems: 'center', justifyContent: 'center', transition: 'all 0.15s', flexShrink: 0,
  });

  // Peek: next couple of real exercises (skip transition-rest filler) so the shelf always
  // previews actual upcoming work, not just "Transition Rest".
  const upcoming = timeline.slice(currentIdx + 1).filter(s => s.type !== 'rest').slice(0, 2).map(s => s.name);
  const peekText = upcoming.length ? upcoming.join('   ·   ') : 'FINISH';

  return (
    <div style={{ flexShrink: 0, borderTop: '1px solid #1c1c1e', background: '#080809' }}>
      <button onClick={onOpenRoadmap} aria-label="Open full workout roadmap" aria-expanded={roadmapOpen} style={{ width: '100%', padding: '6px 16px', minHeight: 36, borderBottom: '1px solid #18181b', background: 'transparent', color: '#9c9ca4', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 8, textAlign: 'left' }}>
        <svg width="11" height="11" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2.5} aria-hidden="true" style={{ flexShrink: 0 }}>
          <path strokeLinecap="round" strokeLinejoin="round" d="M5 15l7-7 7 7" />
        </svg>
        <span style={{ fontFamily: 'Space Mono', fontSize: 10, fontWeight: 700, color: '#6b6b73', textTransform: 'uppercase', letterSpacing: '0.1em', flexShrink: 0 }}>UP NEXT</span>
        <span style={{ fontFamily: 'Space Mono', fontSize: 11, color: '#c7c7cd', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', flex: 1, textTransform: 'uppercase' }}>{peekText}</span>
        <span style={{ fontFamily: 'Space Mono', fontSize: 11, color: '#6b6b73', flexShrink: 0 }}>{currentIdx + 1}/{total}</span>
      </button>

      <div style={{ display: 'flex', alignItems: 'stretch', gap: 8, padding: '8px 16px', paddingBottom: 'max(8px, env(safe-area-inset-bottom))' }}>
        <button onClick={onPrev} disabled={isFirst} aria-label="Previous phase" style={navBtn(isFirst)}>
          <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2.5} aria-hidden="true">
            <path strokeLinecap="round" strokeLinejoin="round" d="M15 19l-7-7 7-7" />
          </svg>
        </button>
        <button onClick={onPlayPause} aria-label={isPlaying ? 'Pause workout' : (currentIdx === 0 ? 'Start workout' : 'Resume workout')} style={{ flex: 1, padding: '11px 12px', background: '#f4f4f0', color: '#0a0a0a', border: 'none', fontFamily: 'Space Mono', fontSize: 13, fontWeight: 700, letterSpacing: '0.15em', textTransform: 'uppercase', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 10, transition: 'background 0.15s' }}>
          {isPlaying ? (
            <>
              <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={3} aria-hidden="true"><path strokeLinecap="round" strokeLinejoin="round" d="M10 9v6m4-6v6" /></svg>
              HALT CYCLE
            </>
          ) : (
            <>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="#0a0a0a" aria-hidden="true"><path d="M8 5v14l11-7z" /></svg>
              {currentIdx === 0 ? 'START SESSION' : 'RESUME'}
            </>
          )}
        </button>
        <button onClick={onNext} disabled={isLast} aria-label="Next phase" style={navBtn(isLast)}>
          <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2.5} aria-hidden="true">
            <path strokeLinecap="round" strokeLinejoin="round" d="M9 5l7 7-7 7" />
          </svg>
        </button>
      </div>
    </div>
  );
}

// ─── ROADMAP BOTTOM SHEET ──────────────────────────────────────────────────

function RoadmapSheet({ timeline, currentIdx, viewFilter, onFilterChange, onJumpTo, isOpen, onClose }) {
  const listRef = useRef(null);

  useEffect(() => {
    if (isOpen && listRef.current) {
      const el = listRef.current.querySelector('[data-active="true"]');
      if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  }, [isOpen, currentIdx]);

  const visible = viewFilter === 'lifts' ? timeline.filter(s => s.type === 'work') : timeline;

  const TYPE_STYLE = {
    work:     { bg: '#f4f4f0', color: '#0a0a0a', label: 'LIFT' },
    rest:     { bg: 'rgba(6,182,212,0.1)', color: '#22d3ee', label: 'REST', border: '1px solid rgba(6,182,212,0.25)' },
    warmup:   { bg: '#27272a', color: '#a1a1aa', label: 'WARM' },
    cooldown: { bg: 'rgba(99,102,241,0.1)', color: '#a5b4fc', label: 'COOL', border: '1px solid rgba(99,102,241,0.25)' },
  };

  return (
    <>
      {isOpen && <div onClick={onClose} style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.65)', zIndex: 40 }} />}
      <div style={{
        position: 'fixed', left: '50%', transform: isOpen ? 'translateX(-50%) translateY(0)' : 'translateX(-50%) translateY(100%)',
        bottom: 0, zIndex: 50, maxHeight: '72vh', width: '100%', maxWidth: 500,
        background: '#0c0c0e', borderTop: '1px solid #27272a', borderLeft: '1px solid #27272a', borderRight: '1px solid #27272a',
        display: 'flex', flexDirection: 'column',
        transition: 'transform 0.3s cubic-bezier(0.4,0,0.2,1)',
      }}>
        <button onClick={onClose} aria-label="Close roadmap" style={{ display: 'flex', justifyContent: 'center', width: '100%', padding: '14px 0', minHeight: 40, border: 'none', borderBottom: '1px solid #1c1c1e', background: 'transparent', cursor: 'pointer', flexShrink: 0 }}>
          <div aria-hidden="true" style={{ width: 36, height: 4, borderRadius: 2, background: '#52525b' }} />
        </button>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '8px 14px', borderBottom: '1px solid #1c1c1e', flexShrink: 0 }}>
          <span style={{ fontFamily: 'Space Mono', fontSize: 12, fontWeight: 700, color: '#c7c7cd', textTransform: 'uppercase', letterSpacing: '0.12em' }}>SYSTEM_CHRONOLOGY</span>
          <div style={{ display: 'flex', gap: 6 }}>
            {['all', 'lifts'].map(f => (
              <button key={f} onClick={() => onFilterChange(f)} aria-pressed={viewFilter === f} style={{
                padding: '8px 14px', minHeight: 36, fontFamily: 'Space Mono', fontSize: 11, fontWeight: 700, textTransform: 'uppercase',
                letterSpacing: '0.08em', cursor: 'pointer', transition: 'all 0.15s',
                background: viewFilter === f ? '#27272a' : 'transparent',
                color: viewFilter === f ? '#f4f4f0' : '#96969e',
                border: viewFilter === f ? '1px solid #3f3f46' : '1px solid transparent',
              }}>
                {f}
              </button>
            ))}
          </div>
        </div>

        <div ref={listRef} style={{ flex: 1, overflowY: 'auto', padding: '8px 10px' }}>
          {visible.map((step) => {
            const realIdx = timeline.indexOf(step);
            const isActive = realIdx === currentIdx;
            const isDone   = realIdx < currentIdx;
            const ts = TYPE_STYLE[step.type] || TYPE_STYLE.warmup;

            return (
              <button key={step.id} data-active={isActive ? "true" : "false"}
                onClick={() => { onJumpTo(realIdx); sfx.nav(); }}
                aria-label={`${step.name}, ${ts.label}${step.round > 0 ? `, round ${step.round}` : ''}, ${step.duration} seconds${isActive ? ', current' : isDone ? ', completed' : ''}`}
                style={{
                  width: '100%', display: 'flex', alignItems: 'center', justifyContent: 'space-between',
                  padding: '12px 10px', minHeight: 44, marginBottom: 4, textAlign: 'left', cursor: 'pointer',
                  background: isActive ? '#18181b' : 'transparent',
                  border: isActive ? '1px solid #3f3f46' : '1px solid transparent',
                  opacity: isDone ? 0.5 : 1, transition: 'all 0.15s',
                }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 10, minWidth: 0, flex: 1 }}>
                  <div aria-hidden="true" style={{ width: 14, height: 14, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
                    {isActive ? (
                      <div style={{ position: 'relative', width: 8, height: 8 }}>
                        <div className="ping-anim" style={{ position: 'absolute', inset: 0, background: '#f4f4f0', opacity: 0.5 }} />
                        <div style={{ width: 8, height: 8, background: '#d97706', position: 'relative' }} />
                      </div>
                    ) : isDone ? (
                      <svg width="11" height="11" fill="none" viewBox="0 0 24 24" stroke="#71717a" strokeWidth={3}>
                        <path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" />
                      </svg>
                    ) : (
                      <div style={{ width: 5, height: 5, background: '#27272a' }} />
                    )}
                  </div>
                  <div style={{ minWidth: 0, flex: 1 }}>
                    <div style={{ fontFamily: 'Space Mono', fontSize: 12, fontWeight: isActive ? 700 : 400, color: isActive ? '#ffffff' : isDone ? '#6b6b73' : '#d0cfcb', textTransform: 'uppercase', letterSpacing: '0.04em', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', textDecoration: isDone ? 'line-through' : 'none' }}>
                      {step.name}
                    </div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginTop: 4 }}>
                      <span style={{ fontFamily: 'Space Mono', fontSize: 10, fontWeight: 700, padding: '2px 6px', background: ts.bg, color: ts.color, border: ts.border || 'none', textTransform: 'uppercase' }}>
                        {ts.label}
                      </span>
                      {step.round > 0 && <span style={{ fontFamily: 'Space Mono', fontSize: 10, color: '#71717a' }}>R{step.round}</span>}
                    </div>
                  </div>
                </div>
                <span style={{ fontFamily: 'Space Mono', fontSize: 11, color: '#96969e', marginLeft: 8, flexShrink: 0 }}>
                  {step.duration >= 60 ? `${Math.floor(step.duration / 60)}m` : `${step.duration}s`}
                </span>
              </button>
            );
          })}
        </div>
      </div>
    </>
  );
}

// ─── CELEBRATION SCREEN ────────────────────────────────────────────────────

function CelebrationScreen({ quote, onReset }) {
  return (
    <div style={{ position: 'fixed', inset: 0, height: '100dvh', background: '#050507', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: 14, zIndex: 50, overflow: 'hidden' }}>
      <div style={{ width: '100%', maxWidth: 380, maxHeight: '100%', overflowY: 'auto', margin: 'auto' }}>
        <div style={{ textAlign: 'center', marginBottom: 14 }}>
          <div style={{ display: 'inline-block', fontFamily: 'Space Mono', fontSize: 12, color: '#96969e', border: '1px solid #27272a', padding: '6px 12px', textTransform: 'uppercase', letterSpacing: '0.1em', marginBottom: 10 }}>
            DIAGNOSTICS: COMPLETE // SYSTEM_CLEAR
          </div>
          <h2 style={{ fontFamily: 'Space Mono', fontSize: 'clamp(1.15rem, 5.5vw, 1.5rem)', fontWeight: 700, color: '#ffffff', letterSpacing: '0.15em', textTransform: 'uppercase', margin: '0 0 6px' }}>
            MS_SESSION_SUCCEEDED
          </h2>
          <p style={{ fontFamily: 'Space Mono', fontSize: 12, color: '#d97706', letterSpacing: '0.12em', textTransform: 'uppercase', margin: 0 }}>
            PHYSICAL INTEGRITY MAINTAINED
          </p>
        </div>

        <div style={{ background: '#0a0a0b', border: '1px solid #1c1c1e', padding: '14px', marginBottom: 12 }}>
          <div style={{ fontFamily: 'Space Mono', fontSize: 11, color: '#96969e', textTransform: 'uppercase', letterSpacing: '0.12em', marginBottom: 8 }}>[COGNITIVE DIRECTIVE]</div>
          <p style={{ fontFamily: 'Barlow Condensed', fontSize: 20, fontStyle: 'italic', color: '#ffffff', lineHeight: 1.3, margin: '0 0 8px' }}>"{quote.text}"</p>
          <p style={{ fontFamily: 'Space Mono', fontSize: 12, color: '#d97706', textTransform: 'uppercase', letterSpacing: '0.1em', textAlign: 'right', margin: 0 }}>— {quote.author}</p>
        </div>

        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 8, marginBottom: 12 }}>
          {[['CHRONO', '30:00'], ['CYCLES', '02/02'], ['TEMPO', 'STRICT']].map(([label, val]) => (
            <div key={label} style={{ background: '#0a0a0b', border: '1px solid #1c1c1e', padding: '8px 8px', textAlign: 'center' }}>
              <div style={{ fontFamily: 'Space Mono', fontSize: 10, color: '#96969e', textTransform: 'uppercase', letterSpacing: '0.1em', marginBottom: 4 }}>{label}</div>
              <div style={{ fontFamily: 'Space Mono', fontSize: 15, fontWeight: 700, color: '#ffffff' }}>{val}</div>
            </div>
          ))}
        </div>

        <button onClick={onReset} style={{ width: '100%', padding: '13px 0', minHeight: 46, background: '#f4f4f0', color: '#0a0a0a', fontFamily: 'Space Mono', fontSize: 13, fontWeight: 700, letterSpacing: '0.15em', textTransform: 'uppercase', cursor: 'pointer', border: 'none', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 10, transition: 'background 0.15s' }}>
          <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2.5} aria-hidden="true">
            <path strokeLinecap="round" strokeLinejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 1121.21 11H18" />
          </svg>
          RESTART DIAGNOSTIC RUN
        </button>
      </div>
    </div>
  );
}

// ─── APP ───────────────────────────────────────────────────────────────────

function App() {
  const { state, dispatch } = useWorkout();

  useEffect(() => {
    const handle = (e) => {
      if (state.phase !== 'workout') return;
      if (e.code === 'Space')      { e.preventDefault(); dispatch({ type: 'TOGGLE_PLAY' }); }
      if (e.code === 'ArrowRight') { dispatch({ type: 'NEXT' }); if (!state.isMuted) sfx.nav(); }
      if (e.code === 'ArrowLeft')  { dispatch({ type: 'PREV' }); if (!state.isMuted) sfx.nav(); }
      if (e.code === 'KeyM')        dispatch({ type: 'TOGGLE_MUTE' });
    };
    window.addEventListener('keydown', handle);
    return () => window.removeEventListener('keydown', handle);
  }, [state.phase, state.isMuted]);

  const step = state.timeline[state.currentIdx];
  const nav  = {
    prev: () => { dispatch({ type: 'PREV' }); if (!state.isMuted) sfx.nav(); },
    next: () => { dispatch({ type: 'NEXT' }); if (!state.isMuted) sfx.nav(); },
  };

  if (state.phase === 'intro') {
    return (
      <IntroScreen
        exhaustionEnabled={state.exhaustionEnabled}
        onToggleExhaustion={() => dispatch({ type: 'TOGGLE_EXHAUSTION' })}
        onStart={(day) => { try { getCtx().resume(); } catch(e) {} dispatch({ type: 'START', day }); }}
      />
    );
  }

  if (state.phase === 'celebration') {
    return <CelebrationScreen quote={state.quote} onReset={() => dispatch({ type: 'RESET' })} />;
  }

  return (
    <div style={{ position: 'fixed', inset: 0, height: '100dvh', background: '#050507', color: '#f4f4f0', display: 'flex', justifyContent: 'center', overflow: 'hidden' }}>
    <div style={{ width: '100%', maxWidth: 500, height: '100%', display: 'flex', flexDirection: 'column', borderLeft: '1px solid #18181b', borderRight: '1px solid #18181b', overflow: 'hidden' }}>
      <Header
        day={state.day} totalSecsLeft={state.totalSecsLeft} isMuted={state.isMuted}
        onToggleMute={() => dispatch({ type: 'TOGGLE_MUTE' })}
        exhaustionEnabled={state.exhaustionEnabled}
        onToggleExhaustion={() => dispatch({ type: 'TOGGLE_EXHAUSTION' })}
        phase={state.phase}
      />
      <DayTabs day={state.day} onChange={(d) => dispatch({ type: 'SET_DAY', day: d })} />
      <ExercisePanel
        step={step} timeline={state.timeline} currentIdx={state.currentIdx}
        timeRemaining={state.timeRemaining} pacerTick={state.pacerTick} isPlaying={state.isPlaying}
        onPrev={nav.prev} onNext={nav.next}
      />
      <BottomBar
        isPlaying={state.isPlaying} onPlayPause={() => dispatch({ type: 'TOGGLE_PLAY' })}
        onPrev={nav.prev} onNext={nav.next} onOpenRoadmap={() => dispatch({ type: 'TOGGLE_ROADMAP' })}
        currentIdx={state.currentIdx} total={state.timeline.length}
        timeline={state.timeline} roadmapOpen={state.roadmapOpen}
      />
      <RoadmapSheet
        timeline={state.timeline} currentIdx={state.currentIdx} viewFilter={state.viewFilter}
        onFilterChange={(f) => dispatch({ type: 'SET_FILTER', filter: f })}
        onJumpTo={(idx) => dispatch({ type: 'JUMP', idx })}
        isOpen={state.roadmapOpen} onClose={() => dispatch({ type: 'CLOSE_ROADMAP' })}
      />
    </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
